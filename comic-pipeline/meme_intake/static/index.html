<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf-token" content="__CSRF_TOKEN__">
<title>PanelForge Meme Generator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1e2127;
    --border: #33373f;
    --text: #e8e9ec;
    --muted: #9aa0aa;
    --accent: #5b8cff;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, sans-serif;
    padding: 24px;
  }
  main {
    max-width: 960px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
  }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  p.subtitle { color: var(--muted); margin: 0 0 20px; font-size: 0.9rem; }
  fieldset {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 0 0 16px;
  }
  legend { color: var(--muted); font-size: 0.8rem; padding: 0 6px; }
  label { display: block; font-size: 0.85rem; margin: 10px 0 4px; }
  input[type="text"], input[type="number"], textarea {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 8px;
    font-family: inherit;
    font-size: 0.9rem;
  }
  textarea { min-height: 70px; resize: vertical; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
  .checkbox-row label { margin: 0; }
  #template-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    gap: 8px;
    max-height: 260px;
    overflow-y: auto;
    padding: 4px;
  }
  .template-option {
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 4px;
    cursor: pointer;
    text-align: center;
    background: var(--panel);
  }
  .template-option img { width: 100%; height: 64px; object-fit: contain; display: block; }
  .template-option .name { font-size: 0.65rem; color: var(--muted); margin-top: 4px; word-break: break-word; }
  .template-option.selected { border-color: var(--accent); }
  #surprise-me.selected { border-color: var(--accent); }
  button {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-size: 0.95rem;
    cursor: pointer;
    width: 100%;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { font-size: 0.85rem; color: var(--muted); margin-top: 10px; min-height: 1.2em; }
  #status.error { color: var(--danger); }
  #result img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border); }
  #result pre {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 0.75rem;
    overflow-x: auto;
    white-space: pre-wrap;
  }
</style>
</head>
<body>
<main>
  <section>
    <h1>PanelForge Meme Generator</h1>
    <p class="subtitle">
      Picks a template, decides whether to remix the artwork, then captions
      it. See <code>docs/MEME-SOURCES.md</code> for where templates come
      from.
    </p>
    <form id="meme-form">
      <fieldset>
        <legend>Project</legend>
        <label for="project">Project folder name</label>
        <input type="text" id="project" name="project" required placeholder="e.g. meme-scratch">
        <label for="name">Meme name</label>
        <input type="text" id="name" name="name" value="meme" required>
        <label for="seed">Seed (optional)</label>
        <input type="number" id="seed" name="seed" placeholder="random if blank">
      </fieldset>

      <fieldset>
        <legend>Brief</legend>
        <label for="brief">Topic / vibe</label>
        <textarea id="brief" name="brief" required placeholder="What's the joke about? Any tone or angle?"></textarea>
      </fieldset>

      <fieldset>
        <legend>Template</legend>
        <div id="template-grid">
          <div class="template-option selected" id="surprise-me" data-surprise="true">
            <div style="height:64px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;">🎲</div>
            <div class="name">Surprise me</div>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Remix</legend>
        <div class="checkbox-row">
          <input type="checkbox" id="allow_remix" name="allow_remix" checked>
          <label for="allow_remix">Allow the base artwork to be remixed, not just captioned</label>
        </div>
      </fieldset>

      <button type="submit" id="submit-btn">Generate meme</button>
      <div id="status"></div>
    </form>
  </section>

  <section id="result"></section>
</main>

<script>
(function () {
  const csrfToken = document.querySelector('meta[name="csrf-token"]').content;
  const grid = document.getElementById('template-grid');
  const surpriseOption = document.getElementById('surprise-me');
  const statusEl = document.getElementById('status');
  const resultEl = document.getElementById('result');
  const submitBtn = document.getElementById('submit-btn');
  let selectedTemplate = null;

  function selectOption(el) {
    document.querySelectorAll('.template-option').forEach((node) => node.classList.remove('selected'));
    el.classList.add('selected');
  }

  surpriseOption.addEventListener('click', () => {
    selectedTemplate = null;
    selectOption(surpriseOption);
  });

  fetch('/templates')
    .then((response) => response.json())
    .then((data) => {
      (data.templates || []).forEach((template) => {
        const el = document.createElement('div');
        el.className = 'template-option';
        el.innerHTML = `<img src="${template.source_url}" alt="${template.name}" loading="lazy">
                         <div class="name">${template.name}</div>`;
        el.addEventListener('click', () => {
          selectedTemplate = template;
          selectOption(el);
        });
        grid.appendChild(el);
      });
    })
    .catch(() => {
      statusEl.textContent = 'Could not load templates (Imgflip unreachable?). "Surprise me" will still try at generate time.';
    });

  document.getElementById('meme-form').addEventListener('submit', (event) => {
    event.preventDefault();
    submitBtn.disabled = true;
    statusEl.classList.remove('error');
    statusEl.textContent = 'Generating... this runs Ollama and, if remixing, ComfyUI, so it can take a minute or two.';
    resultEl.innerHTML = '';

    const seedField = document.getElementById('seed').value;
    const body = {
      csrf_token: csrfToken,
      project: document.getElementById('project').value,
      name: document.getElementById('name').value,
      brief: document.getElementById('brief').value,
      seed: seedField === '' ? null : Number(seedField),
      allow_remix: document.getElementById('allow_remix').checked,
      template: selectedTemplate,
    };

    fetch('/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(async (response) => {
        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error || `Request failed (${response.status})`);
        }
        return data;
      })
      .then((data) => {
        statusEl.textContent = 'Done.';
        resultEl.innerHTML = `<img src="${data.image}" alt="Generated meme">
                               <pre>${JSON.stringify(data.meme, null, 2)}</pre>`;
      })
      .catch((error) => {
        statusEl.classList.add('error');
        statusEl.textContent = error.message;
      })
      .finally(() => {
        submitBtn.disabled = false;
      });
  });
})();
</script>
</body>
</html>
